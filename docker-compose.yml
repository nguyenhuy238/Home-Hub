services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: homehub
      POSTGRES_PASSWORD: homehub
      POSTGRES_DB: homehub
    ports:
      - "5432:5432"
    volumes:
      - homehub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homehub -d homehub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  homehub-postgres:
